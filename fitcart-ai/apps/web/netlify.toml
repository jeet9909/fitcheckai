# react-router-dom's BrowserRouter uses real history-based routing (not
# hash routing) — without this, a direct load or refresh on any non-root
# route (e.g. /discover) 404s, since Netlify's CDN otherwise only serves
# files that exist on disk.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
