/* Image preparation: skeleton, soft preview, downward reveal, result handoff. */
#generationDialog{width:440px;padding:28px;text-align:center;overflow-x:hidden}
#generationDialog[open]{animation:popup-in .3s ease-out both}
#generationDialog.leaving{opacity:0;transform:translateY(-8px) scale(.98);transition:opacity .25s,transform .25s}
#generationDialog h2{font-family:Georgia,serif;font-weight:400;font-size:30px;margin:14px 0 8px}
.generation-stage{position:relative;width:min(100%,260px);aspect-ratio:5/6;margin:22px auto;border-radius:70px 70px 14px 14px;overflow:hidden;background:var(--warm);isolation:isolate;box-shadow:0 12px 35px #142e2010}
.generation-skeleton{position:absolute;inset:0;z-index:3;background:var(--warm);transition:opacity .5s}
.generation-skeleton:after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 20%,#ffffff77 48%,transparent 76%);transform:translateX(-100%);animation:mirror-shimmer 1.5s ease-in-out infinite}
.skeleton-head{position:absolute;top:12%;left:40%;width:20%;height:17%;border-radius:50%;background:var(--line)}
.skeleton-body{position:absolute;top:32%;left:25%;width:50%;height:60%;border-radius:40% 40% 14% 14%;background:var(--line)}
.generation-image{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
.generation-image.soft-preview{filter:blur(17px);transform:scale(1.08);transition:opacity .6s,filter 1.8s,transform 1.8s}
.generation-image.sharp-preview{clip-path:inset(0 0 100% 0);filter:blur(8px);transform:scale(1.025);transition:clip-path 1.8s cubic-bezier(.45,0,.2,1),filter 1.8s,transform 1.8s}
.generation-stage.preview .generation-skeleton{opacity:0;pointer-events:none}
.generation-stage.preview .soft-preview{opacity:1}
.generation-stage.reveal .sharp-preview{opacity:1;clip-path:inset(0);filter:blur(0);transform:scale(1)}
.generation-stage.reveal .soft-preview{filter:blur(0);transform:scale(1)}
.reveal-light{position:absolute;top:0;left:0;right:0;height:2px;background:#eaffeb;box-shadow:0 0 18px 5px #eaffeb80;opacity:0;z-index:2}
.generation-stage.reveal .reveal-light{animation:mirror-scan 1.8s cubic-bezier(.45,0,.2,1) both}
.generation-stage.complete .reveal-light{display:none}
.generation-track{height:4px;width:100%;background:var(--line);border-radius:8px;overflow:hidden;margin:18px 0 12px}
.generation-track:after{content:'';display:block;width:35%;height:100%;border-radius:8px;background:var(--accent);animation:mirror-progress 1.5s ease-in-out infinite}
.generation-track.complete:after{animation:none;width:100%;transition:width .3s}
.generation-caption{min-height:24px;font-size:14px;color:var(--muted)}
.result-enter{animation:result-arrive .6s ease-out both}
@keyframes mirror-shimmer{to{transform:translateX(100%)}}
@keyframes mirror-scan{0%{top:0;opacity:0}12%{opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
@keyframes mirror-progress{0%{transform:translateX(-110%)}100%{transform:translateX(390%)}}
@keyframes popup-in{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes result-arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:650px){#generationDialog{padding:22px}.generation-stage{width:min(100%,225px);margin:16px auto}#generationDialog h2{font-size:27px}}
@media(prefers-reduced-motion:reduce){.generation-image.soft-preview,.generation-image.sharp-preview{filter:none;transform:none}.reveal-light{display:none}.generation-image.sharp-preview{clip-path:none}}

const RESEARCH=`
<p class="lead">Build a personal fitting room around three distinct questions: Is this the same product? How might it look on me? What evidence supports my size choice?</p>
<p>The strongest initial product is a source-first clothing workflow with reliable variant identity, a visual preview and explainable size guidance. Universal store coverage, exact stock quantities and guaranteed fit should not be launch promises.</p>
<nav aria-label="Research sections"><a href="#r-data">Store data</a><a href="#r-match">Matching</a><a href="#r-tryon">Try-on</a><a href="#r-fit">Sizing</a><a href="#r-build">Build plan</a><a href="#r-sources">Sources</a></nav>
<h3 id="r-data">1. Retrieve the original product first</h3>
<p>Amazonâ€™s current documentation identifies Creators API as the successor to PA-API 5. It provides product lookup, search and variation operations. Access requires marketplace enrolment, registration and credentials; eligibility must be verified for the actual India account. The current introduction also states a qualifying-sales requirement. Do not base a new integration on old PA-API tutorials. <a href="https://affiliate-program.amazon.com/creatorsapi/docs/en-us/introduction" target="_blank" rel="noopener">[1]</a> <a href="https://affiliate-program.amazon.com/creatorsapi/docs/en-us/paapiv5-deprecation" target="_blank" rel="noopener">[2]</a></p>
<p>Flipkartâ€™s published affiliate reference documents product IDs, image URLs, size and colour variants, style codes, and stock flags. It also documents shipping information with context-specific limitations. These public documents do not establish that new applicants can obtain working credentials today, that every fashion listing fills every field, or that a stock flag means an exact remaining count. Validate access and representative responses before promising coverage. <a href="https://affiliate.flipkart.com/api-docs/af_prod_ref.html" target="_blank" rel="noopener">[3]</a></p>
<div class="tablewrap"><table><thead><tr><th>Store</th><th>Candidate route</th><th>Unresolved before launch</th></tr></thead><tbody><tr><td>Amazon India</td><td>Creators API through approved Associates access</td><td>Account eligibility, field coverage and permitted image use</td></tr><tr><td>Flipkart</td><td>Documented affiliate APIs, if access is granted</td><td>Onboarding, live variant completeness and location-aware delivery</td></tr><tr><td>Myntra / AJIO</td><td>Negotiate an approved merchant or partner feed</td><td>No generally available consumer-import API was verified in this research</td></tr><tr><td>Nike</td><td>Investigate regional affiliate / merchant agreement</td><td>The public affiliate information is not evidence of unrestricted India catalog access</td></tr><tr><td>Other stores</td><td>Approved connectors; manual entry fallback</td><td>Identity, rights, freshness and exact field availability</td></tr></tbody></table></div>
<p>Nike describes an approval-based affiliate programme. Affiliate enrolment is not itself a guarantee of full catalog, inventory or delivery API access. Verify the country-specific programme and contracted feed separately. <a href="https://www.nike.com/help/a/nike-affiliate-program" target="_blank" rel="noopener">[4]</a></p>
<p><strong>Recommended data contract:</strong> retain the submitted URL, resolved canonical URL, store, store item ID, parent ID, selected variant ID, brand, manufacturer style code, colour code, category, size label and size system. Keep images with their source URLs, dimensions and usage permissions. Each offer needs seller, currency, item price, shipping cost, conditional discounts, availability state, optional quantity, delivery estimate and location, return conditions and retrieval time. Preserve missing values rather than guessing.</p>
<p>Resolve shortened URLs on the backend and show the final store. Re-check each redirect against allowed public destinations. Never make a general-purpose URL proxy that can reach private services. A failed import should preserve the pasted link and explain whether the store is unsupported, the item is unavailable, or retrieval failed. Offer manual entry without silently substituting another item.</p>
<h3 id="r-match">2. Match products, not just similar pictures</h3>
<p>Googleâ€™s product-variant documentation distinguishes product groups from variants and explicitly models variant attributes such as colour and size. This supports a data design that separates a style from its purchasable variants. <a href="https://developers.google.com/search/docs/appearance/structured-data/product-variants" target="_blank" rel="noopener">[5]</a></p>
<p><strong>Recommended matching method:</strong> use a reliable manufacturer identifier or GTIN where available, then verify brand, style, colour and size system. Store-specific IDs cannot simply be compared across marketplaces. Use names and image similarity to find candidates, then verify identifiers and variant attributes. Never label a visually similar shirt as the same product solely because its photo resembles the source.</p>
<p>Represent match quality as verified exact variant, possible match requiring confirmation, or similar alternative. Only verified matches belong in an exact comparison. A different colour or a different model year should be a separate item. Mixed EU, UK, US and brand-specific size labels need explicit mapping; equal-looking labels do not establish equal dimensions.</p>
<p>Compare the payable amount, including known delivery charges. Keep membership prices, card offers and coupons separate until eligibility is established. Preserve the original store at the top by default, while allowing the shopper to sort. Display the selected sizeâ€™s availability, the seller and the return policy. If delivery cannot be checked for a PIN code, say so. Do not convert a cached shipping estimate into a checkout promise.</p>
<h3 id="r-tryon">3. Visual try-on is an appearance service</h3>
<p>Googleâ€™s Virtual Try-On documentation describes generation from a person image and a clothing product image. Its model page lists input, format and output limits. This makes it a candidate to benchmark for clothing, not evidence that a single model supports every wearable or accepts multiple body angles as one reconstruction request. Confirm the precise endpoint and deployment region during integration. <a href="https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/capabilities/generate-virtual-try-on-images" target="_blank" rel="noopener">[6]</a> <a href="https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/vto/virtual-try-on-001" target="_blank" rel="noopener">[7]</a></p>
<p>Googleâ€™s shopper-facing guidance explicitly separates generated appearance from actual fit, size recommendation and merchant size availability. It also acknowledges possible errors in personal features and garment details. This is why FitCart should not produce a numerical fit-confidence claim from the rendered picture. <a href="https://support.google.com/merchants/answer/16159685?hl=en" target="_blank" rel="noopener">[8]</a></p>
<p><strong>Recommended launch scope:</strong> begin with one supported clothing category, preferably uncomplicated tops, and add bottoms after measured validation. Treat shoes, watches and other accessories as separate rendering and sizing projects. A watch preview needs wrist placement; footwear needs foot orientation and scale. Do not apply a clothing model indiscriminately.</p>
<p>Benchmark candidate services on garment fidelity, logo and pattern preservation, face and body preservation, occlusion, unusual poses, seated users, assistive devices, processing latency, failures and cost per usable result. Use licensed test images and explicit consent. Count failed and retried renders in the economics. Choose a provider after that evaluation, not from a promotional image alone.</p>
<p>Extra angles should have a stated purpose. They may support separate views or quality checks if the selected provider supports that workflow. They do not automatically make one frontal output accurate or create a faithful 3D body. Retain the original photo and let shoppers compare it with the output. If body shape or garment details are altered, provide a retry or clear failure state.</p>
<h3 id="r-fit">4. Size guidance requires its own evidence</h3>
<p><strong>Recommended method:</strong> first establish whether a chart describes body measurements or finished garment measurements. Preserve its product, brand, category, units and version. For body charts, compare the relevant measurements directly. For garment charts, account for intended ease and stretch instead of treating garment circumference as body circumference.</p>
<p>Height and weight are useful optional context, but they do not uniquely determine chest, waist, hips, inseam or foot width. A tops model may need chest and waist; bottoms may need waist, hips and inseam; footwear needs foot length and width; watches need wrist circumference and strap limits. Let users skip irrelevant fields. Do not require a standing pose or infer that a person can supply every measurement.</p>
<p>When measurements cross size boundaries or the chart is missing, show that uncertainty. State the reason for a suggestion, the relevant ranges and whether the suggested size is in stock. Keep â€œrecommended sizeâ€ separate from the size the shopper has selected. Re-check offers after a change.</p>
<p>A production score needs calibration against real fit feedback or a validated measurement model. This prototype deliberately reports a simple count of matched chart ranges and a demo chart match. It does not call that count an accuracy rate, probability or guaranteed fit. Its chart and clothing item are fictional, so the recommendations are only for evaluating the interaction.</p>
<h3 id="r-build">5. Production architecture and release order</h3>
<p>A standalone HTML file can run interface state, input validation, local photo handling, calculations and image export. Browser cross-origin restrictions and remote authentication mean it cannot universally read retailer pages as though they were local data. A permissive proxy would not grant content rights or valid store credentials. <a href="https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS" target="_blank" rel="noopener">[9]</a></p>
<p>Recommended production components are a backend URL resolver, merchant-specific connectors, a normalized catalog and offer store, an exact-variant matching service, a sizing module and a queued image-generation service. Keep credentials server-side. Have each connector report its capabilities explicitly, so the frontend never assumes quantity, size charts or location-specific delivery are present.</p>
<p>Photo handling should have explicit consent, documented retention, deletion and access controls. Signed private image access and expiring share links are sensible implementation choices. Downloading should remain possible without publishing the original photo. Check rights to display, cache and transform merchant imagery independently: API access does not automatically establish permission to send images to an AI provider. Amazonâ€™s documentation directs integrators to the applicable localeâ€™s licence and programme agreement. The India agreement returned in this research carries a November 2021 update label; review all current incorporated terms before launch. <a href="https://affiliate-program.amazon.com/creatorsapi/docs/en-us/license-agreement" target="_blank" rel="noopener">[10]</a> <a href="https://affiliate-program.amazon.in/help/operating/agreement" target="_blank" rel="noopener">[11]</a></p>
<ol><li><strong>Validate access:</strong> obtain one usable authorized source and test complete variants, source image rights and refresh behaviour on real products.</li><li><strong>Ship the original-store journey:</strong> import, confirm product and colour, choose size, collect consent, render a supported item and return to its exact listing.</li><li><strong>Add comparison:</strong> introduce a second contracted source only after exact-variant matching is evaluated. Keep unknown values visible.</li><li><strong>Validate sizing:</strong> collect consented fit outcomes and examine errors across brands, sizes and body types before exposing a calibrated score.</li><li><strong>Broaden coverage:</strong> add more stores and wearable categories behind explicit capability checks.</li></ol>
<p>Proposed acceptance checks include wrong-colour matches, out-of-stock sizes, missing charts, outdated prices, unavailable PIN codes, duplicate jobs, malformed uploads, provider timeouts, poor renders and changes of product mid-flow. Test keyboard operation, mobile text enlargement, cancellation and deletion as part of the same journey.</p>
<h3>6. What this standalone file actually does</h3>
<div class="tablewrap"><table><thead><tr><th>Feature</th><th>Implemented behaviour</th></tr></thead><tbody><tr><td>Link input</td><td>Validates the URL and recognizes common store domains; offers manual product entry. No live fetching.</td></tr><tr><td>Comparison</td><td>Fictional offers with size-specific stock, total-price sorting and illustrative delivery. No verified cross-store search.</td></tr><tr><td>Photos</td><td>Locally decodes and resizes up to three photos. Only the first appears in the outfit board; extra angles are not used for rendering.</td></tr><tr><td>Preview</td><td>A pre-made AI sample, or a real local photo-and-product board. No personalized generative request.</td></tr><tr><td>Sizing</td><td>Checks chest and waist against an explicitly fictional chart for the sample top. No verified fit score.</td></tr><tr><td>Export and share</td><td>Exports a PNG; offers native file sharing where available, with a download fallback.</td></tr><tr><td>Purchase</td><td>Manual products link to the submitted source URL. Sample offers explain the handoff without inventing a purchasable listing.</td></tr></tbody></table></div>
<p>The existing FitCart frontend source exposed discovery, product, setup, processing and result routes. This redesign consolidates the decision sequence and prioritizes the submitted product link. That source inspection is not a visual audit or verification of the existing backend. The new prototype is a separate deliverable.</p>

function tierCard(key,desc,features,cta,featured=false){const p=PLANS[key];return `<article class="card tier ${featured?'featured':''}"><span class="badge ${featured?'':'outline'}">${featured?'For regular shoppers':key==='free'?'No card needed':'For frequent explorers'}</span><h3>${p.name}</h3><p class="small muted">${desc}</p><div class="tier-price">â‚¹${p.price}<span> / month</span></div><span class="micro muted">${key==='free'?'Free guest experience':'Example monthly price'}</span><ul>${features.map(f=>'<li>'+f+'</li>').join('')}</ul><button class="btn ${featured?'':'secondary'} wide" ${key==='free'?'data-action="tryfree"':'data-plan="'+key+'"'}>${cta}</button></article>`}
function appendSignupPrompt(){const panel=document.createElement('section');panel.className='after-look';panel.id='afterLookInvite';panel.innerHTML=member?`<div><h3>Your ${PLANS[member.plan].name} demo experience</h3><p class="small muted">Your look is ready to download. Account storage and paid features are planned.</p></div><button class="btn secondary" data-action="pricing">Compare plans</button>`:`<div><h3>Was that helpful? Make room for more.</h3><p class="small muted">Start with Free, or explore Basic and Pro for more planned previews. You can keep using this demo as a guest.</p></div><div class="row"><button class="btn" data-action="signupAfter">Create a free account</button><button class="btn secondary" data-action="pricing">See plans</button><button class="linkbtn" data-action="dismissInvite">Not now</button></div>`;screen.appendChild(panel)}
function authDialog(mode='signin'){modal(mode==='signin'?'Welcome back to FitCart':'Make room for your next look',`<div class="auth-switch"><button class="btn ${mode==='signin'?'soft':'secondary'}" data-auth="signin">Sign in</button><button class="btn ${mode==='signup'?'soft':'secondary'}" data-auth="signup">Create account</button></div><p class="notice">Demo sign-in only. No real account is created, no email is sent, and no password or payment details are needed.</p>${pendingPlan?'<p class="small">Continue to review <strong>'+PLANS[pendingPlan].name+'</strong> at the example price of â‚¹'+PLANS[pendingPlan].price+'/month.</p>':''}<form id="authForm"><label class="field">Your name<input id="authName" class="input" maxlength="60" autocomplete="given-name" placeholder="e.g. Jeet" required></label><label class="field">Email<input id="authEmail" class="input" type="email" maxlength="160" autocomplete="email" placeholder="you@example.com" required></label><button class="btn wide" type="submit">Continue in demo ${icon('arrow')}</button></form><p class="micro muted" style="margin-top:14px">Used only to preview your account in this tab. Reloading clears it.</p><button class="linkbtn" data-action="guestInstead">Continue as a guest instead</button>`);$('#authForm').onsubmit=e=>{e.preventDefault();const name=$('#authName').value.trim();if(!name){$('#authName').setCustomValidity('Please enter your name.');$('#authName').reportValidity();$('#authName').oninput=()=>$('#authName').setCustomValidity('');return}member={name,email:$('#authEmail').value.trim(),plan:'free'};$('#modal').close();updateAccountNav();if(pendingPlan){reviewPlan(pendingPlan)}else{showPage(authReturn);toast('Demo sign-in complete. Your current look is still here.')}}}
function selectPlan(plan){if(!['basic','pro'].includes(plan))return;pendingPlan=plan;authReturn=pageView;if(member)reviewPlan(plan);else authDialog('signup')}
function reviewPlan(key){const plan=PLANS[key];modal('Review your '+plan.name+' plan',`<span class="badge sand">Plan preview Â· No payment</span><div class="tier-price">â‚¹${plan.price}<span> / month, example price</span></div><p>${plan.looks} planned previews per month.</p><p class="muted">Youâ€™re previewing this plan as <strong>${esc(member.name)}</strong>. Choosing it here changes your demo account label only. No subscription starts, no charge is made, and extra previews or priority processing are not activated.</p><div class="row"><button class="btn" data-activate="${key}">Preview ${plan.name} in my account</button><button class="btn secondary" data-action="cancelPlan">Keep my current plan</button></div>`)}
function accountPage(){if(!member){pageView='marketing';marketing();return}const plan=PLANS[member.plan];screen.innerHTML=`<section class="account-panel"><div class="eyebrow">Your fitting room account</div><h1 style="font-size:42px">Hi, ${esc(member.name)}.</h1><p class="muted">Pick up where you left off.</p><div class="card pad"><span class="badge sand">Demo account Â· This tab only</span><dl class="account-details"><div><dt class="small muted">Email, not verified</dt><dd style="margin:5px 0;overflow-wrap:anywhere">${esc(member.email)}</dd></div><div><dt class="small muted">Selected demo plan</dt><dd style="margin:5px 0">${plan.name} Â· â‚¹${plan.price}/month ${member.plan==='free'?'':'(example)'}</dd></div></dl><p class="infobox">No active subscription or billing. Planned allowance: ${plan.looks} previews/month. Usage limits and saved looks are not connected in this file.</p><div class="row"><button class="btn" data-action="resumeRoom">${state.result?'Return to my look':'Open my fitting room'} ${icon('arrow')}</button><button class="btn secondary" data-action="pricing">Explore plans</button></div><button class="linkbtn" data-action="signout" style="margin-top:20px">Sign out of demo</button></div></section>`}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.plan)return selectPlan(t.dataset.plan);if(t.dataset.auth)return authDialog(t.dataset.auth);if(t.dataset.activate){const key=t.dataset.activate;if(member&&['basic','pro'].includes(key)){member.plan=key;pendingPlan=null;$('#modal').close();showPage('account');toast('Plan preview updated. No payment or subscription created.')}return}switch(t.dataset.action){case'landing':showPage('marketing');break;case'how':showPage('marketing','how-it-works');break;case'pricing':showPage('marketing','pricing');break;case'tryfree':pendingPlan=null;showPage('try-on');break;case'resumeRoom':showPage('try-on');break;case'signin':if(member)showPage('account');else{pendingPlan=null;authReturn='try-on';authDialog()}break;case'signupAfter':pendingPlan=null;authReturn='try-on';authDialog('signup');break;case'guestInstead':pendingPlan=null;$('#modal').close();showPage('try-on');break;case'dismissInvite':$('#afterLookInvite')?.remove();break;case'cancelPlan':pendingPlan=null;$('#modal').close();render();break;case'signout':member=null;pendingPlan=null;showPage('marketing');toast('Signed out of demo. Your fitting-room session remains until you clear it.');break}});
