<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FitCart AI</title>
    <script>
      // GitHub Pages SPA fallback: encode the requested path into a query
      // string and redirect to the app root, where the inline script in
      // index.html decodes it back into the real client-side route.
      var base = '/fitcheckai/';
      var path = location.pathname.slice(base.length);
      var target = base + '?redirect=' + encodeURIComponent(path) + location.search.replace(/^\?/, '&') + location.hash;
      location.replace(target);
    </script>
  </head>
  <body></body>
</html>
